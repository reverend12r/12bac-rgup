<!DOCTYPE html>
<html lang="ru" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Планер Студента — 12 Группа</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        html, body { 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            position: fixed; 
            inset: 0;
            font-family: 'Inter', sans-serif; 
            background-color: #cbd5e1; 
            margin: 0;
            padding: 0;
        }

        /* Тонкий аккуратный скроллбар для ПК */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(0.95); opacity: 1; }
        }
        .live-badge-ring {
            animation: pulse-ring 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex justify-center items-center h-full w-full">

    <!-- Главный контейнер -->
    <div class="w-full max-w-md md:max-w-3xl lg:max-w-5xl bg-gray-50 h-full flex flex-col overflow-hidden shadow-2xl relative">
        
        <!-- Шапка (Скрывается при открытии сайтов) -->
        <header id="main-header" class="bg-indigo-600 text-white pt-10 md:pt-6 pb-5 px-6 rounded-b-3xl shadow-md z-20 shrink-0 transition-all">
            <div class="flex justify-between items-center md:max-w-3xl lg:max-w-5xl mx-auto w-full">
                <div>
                    <h1 id="header-title" class="text-2xl font-bold tracking-wide">Моя Учёба</h1>
                    <p id="week-subtitle" class="text-indigo-200 text-xs mt-0.5 font-medium">12 Группа • КФ РГУП</p>
                </div>
                <div class="text-right bg-indigo-700/60 backdrop-blur-md px-3 py-1.5 rounded-xl border border-indigo-400/30">
                    <span id="current-time-text" class="text-sm font-bold font-mono tracking-wider">00:00:00</span>
                </div>
            </div>
        </header>

        <!-- Основная область с min-h-0 для починки скролла -->
        <main id="main-content" class="flex-1 flex flex-col min-h-0 overflow-hidden relative z-0">
            
            <!-- ================= РАЗДЕЛ УЧЁБА ================= -->
            <section id="view-study" class="flex-1 flex flex-col min-h-0 w-full" style="display: flex;">
                
                <!-- Подменю -->
                <div id="sub-tabs-container" class="shrink-0 flex bg-white/95 backdrop-blur-md shadow-sm border-b border-gray-200 z-10 w-full px-2 py-2 transition-all">
                    <div class="flex w-full max-w-xl mx-auto gap-1 overflow-x-auto hide-scroll">
                        <button onclick="switchStudyTab('schedule')" id="tab-schedule" class="flex-1 py-2 px-1 text-[11px] font-bold rounded-lg bg-indigo-50 text-indigo-600 transition-colors whitespace-nowrap">Расписание</button>
                        <button onclick="switchStudyTab('bells')" id="tab-bells" class="flex-1 py-2 px-1 text-[11px] font-bold rounded-lg text-gray-500 hover:bg-gray-50 transition-colors whitespace-nowrap">Звонки</button>
                        <button onclick="switchStudyTab('portal')" id="tab-portal" class="flex-1 py-2 px-1 text-[11px] font-bold rounded-lg text-gray-500 hover:bg-gray-50 transition-colors whitespace-nowrap">Фемида</button>
                        <button onclick="switchStudyTab('library')" id="tab-library" class="flex-1 py-2 px-1 text-[11px] font-bold rounded-lg text-gray-500 hover:bg-gray-50 transition-colors whitespace-nowrap">Библиотека</button>
                    </div>
                </div>

                <!-- Блок с идеальным скроллом -->
                <div id="scrollable-study-content" class="flex-1 min-h-0 overflow-y-auto w-full flex flex-col">
                    
                    <!-- Контент: Расписание -->
                    <div id="content-schedule" class="flex-col w-full md:max-w-2xl self-center p-4 gap-4" style="display: flex;">
                        <div id="week-status-banner" class="bg-indigo-950 text-white px-4 py-3 rounded-2xl shadow-sm flex items-center justify-between">
                            <div>
                                <span class="text-[10px] text-indigo-300 font-semibold uppercase tracking-wider block">Текущая неделя</span>
                                <span id="week-type-name" class="text-base font-bold text-amber-300">Неделя «Б»</span>
                            </div>
                            <div class="text-right">
                                <span id="today-date-text" class="text-xs text-indigo-200 font-medium">Среда, 23 сент.</span>
                            </div>
                        </div>

                        <div id="week-schedule-container" class="flex flex-col gap-4">
                            <!-- Дни недели -->
                        </div>
                    </div>

                    <!-- Контент: Расписание звонков -->
                    <div id="content-bells" class="flex-col w-full md:max-w-xl self-center p-4 gap-3" style="display: none;">
                        <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Расписание звонков</h2>
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                            <ul class="divide-y divide-gray-100 text-sm" id="bells-list"></ul>
                        </div>
                    </div>
                </div>

                <!-- Контент: Портал Фемида (На весь экран) -->
                <div id="content-portal" class="flex-1 min-h-0 w-full relative bg-gray-50" style="display: none;">
                    <iframe src="https://femida.raj.ru" class="absolute inset-0 w-full h-full border-0"></iframe>
                    
                    <a href="https://femida.raj.ru" target="_blank" class="absolute bottom-4 right-4 bg-indigo-600/95 backdrop-blur text-white px-3.5 py-2.5 rounded-xl shadow-lg border border-indigo-500/50 text-xs font-bold hover:bg-indigo-700 transition-all flex items-center gap-2 z-20">
                        В браузере <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                </div>

                <!-- Контент: Электронная Библиотека (На весь экран) -->
                <div id="content-library" class="flex-1 min-h-0 w-full relative bg-gray-50" style="display: none;">
                    <iframe src="https://biblioteka.raj.ru/MegaPro/Web/Home/Index" class="absolute inset-0 w-full h-full border-0"></iframe>
                    
                    <a href="https://biblioteka.raj.ru/MegaPro/Web/Home/Index" target="_blank" class="absolute bottom-4 right-4 bg-indigo-600/95 backdrop-blur text-white px-3.5 py-2.5 rounded-xl shadow-lg border border-indigo-500/50 text-xs font-bold hover:bg-indigo-700 transition-all flex items-center gap-2 z-20">
                        В браузере <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                </div>

            </section>

            <!-- ================= РАЗДЕЛ КАЛЕНДАРЬ И ЗАДАЧИ ================= -->
            <section id="view-calendar" class="flex-1 min-h-0 overflow-y-auto p-4 w-full flex flex-col md:max-w-xl self-center gap-4" style="display: none;">
                
                <!-- Виджет Календаря -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-center mb-3">
                        <h2 id="calendar-month-title" class="text-sm font-bold text-gray-800">Сентябрь 2026</h2>
                        <div class="flex gap-1">
                            <button onclick="changeMonth(-1)" class="w-7 h-7 rounded-lg bg-gray-50 hover:bg-gray-100 flex items-center justify-center text-gray-600 text-xs"><i class="fa-solid fa-chevron-left"></i></button>
                            <button onclick="changeMonth(1)" class="w-7 h-7 rounded-lg bg-gray-50 hover:bg-gray-100 flex items-center justify-center text-gray-600 text-xs"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-gray-400 mb-2">
                        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
                    </div>
                    
                    <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-xs">
                        <!-- Сетка дней -->
                    </div>
                </div>

                <!-- Плашка со статусом -->
                <div id="day-study-info-banner" class="bg-indigo-50 border border-indigo-100 p-3.5 rounded-2xl flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-clock-rotate-left text-sm"></i>
                    </div>
                    <div>
                        <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-wider block">Учебная нагрузка</span>
                        <p id="study-banner-text" class="text-xs font-bold text-indigo-950">Загрузка...</p>
                    </div>
                </div>

                <!-- Добавление задачи -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Задача на <span id="selected-date-label" class="text-indigo-600 font-bold">выбранный день</span></h3>
                    </div>
                    <div class="flex flex-col gap-2.5">
                        <input type="text" id="task-text" placeholder="Что нужно сделать?" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                        <button onclick="addTask()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl py-2.5 text-xs transition-all shadow-sm">Добавить задачу</button>
                    </div>
                </div>

                <!-- Список задач -->
                <div>
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Задачи на день</h3>
                    <ul id="task-list" class="flex flex-col gap-2.5 pb-6">
                        <!-- Список задач -->
                    </ul>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bg-white border-t border-gray-200 pt-2 px-6 flex justify-around md:justify-center md:gap-32 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-20 shrink-0" style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom));">
            <button onclick="switchView('study')" id="nav-study" class="flex flex-col items-center p-2 text-indigo-600 transition-colors w-20">
                <div class="bg-indigo-100 p-2 rounded-xl mb-1"><i class="fa-solid fa-graduation-cap text-lg"></i></div>
                <span class="text-[11px] font-bold">Учёба</span>
            </button>
            <button onclick="switchView('calendar')" id="nav-calendar" class="flex flex-col items-center p-2 text-gray-400 hover:text-gray-800 transition-colors w-20">
                <div class="p-2 mb-1"><i class="fa-regular fa-calendar-check text-lg"></i></div>
                <span class="text-[11px] font-semibold">Задачи</span>
            </button>
        </nav>
    </div>

    <script>
        const bells = [
            { num: 1, start: "08:30", end: "09:50" },
            { num: 2, start: "09:55", end: "11:15" },
            { num: 3, start: "11:35", end: "12:55" },
            { num: 4, start: "13:00", end: "14:20" },
            { num: 5, start: "14:25", end: "15:45" },
            { num: 6, start: "16:05", end: "17:25" },
            { num: 7, start: "17:30", end: "18:50" }
        ];

        const dayNames = { 1: "Понедельник", 2: "Вторник", 3: "Среда", 4: "Четверг", 5: "Пятница" };

        const scheduleData = {
            "А": {
                1: [
                    { num: 1, title: "Теория государства и права", teacher: "ст.пр. Штурцев Ю.Ю.", room: "315", type: "Лекция" },
                    { num: 2, title: "Логика", teacher: "доц. Парунова Ю.Д.", room: "316", type: "Семинар" },
                    { num: 3, title: "Основы российской государственности", teacher: "доц. Андрейченко О.И.", room: "316", type: "Семинар" }
                ],
                2: [
                    { num: 1, title: "История России", teacher: "доц. Хутько Т.В.", room: "315", type: "Лекция" },
                    { num: 2, title: "Русский язык и культура речи", teacher: "доц. Андрейченко О.И.", room: "402", type: "Семинар" },
                    { num: 3, title: "Конституционное право", teacher: "ст.пр. Емельянцев А.Э.", room: "402", type: "Семинар" }
                ],
                3: [
                    { num: 1, title: "Правоохранительные органы", teacher: "доц. Стрельникова И.Ю.", room: "315", type: "Лекция" },
                    { num: 2, title: "История России", teacher: "доц. Хутько Т.В.", room: "403", type: "Семинар" },
                    { num: 3, title: "Латинский язык", teacher: "ст.пр. Куриленко Е.Е.", room: "403", type: "Семинар" },
                    { num: 4, title: "Теория государства и права", teacher: "ст.пр. Штурцев Ю.Ю.", room: "403", type: "Семинар" }
                ],
                4: [
                    { num: 1, title: "История России", teacher: "доц. Хутько Т.В.", room: "315", type: "Лекция" },
                    { num: 2, title: "Безопасность жизнедеятельности", teacher: "доц. Кислый С.А.", room: "316", type: "Семинар" },
                    { num: 3, title: "Иностранный язык", teacher: "проф. Погребняк Н.Н., доц. Эмирильясова С.С.", room: "205, 114", type: "Семинар" }
                ],
                5: [
                    { num: 2, title: "Правоохранительные органы", teacher: "доц. Стрельникова И.Ю.", room: "316", type: "Семинар" },
                    { num: 3, title: "Конституционное право", teacher: "проф. Еремина И.С.", room: "309", type: "Лекция" },
                    { num: 4, title: "Физическая культура и спорт", teacher: "доц. Гружевский В.А.", room: "129", type: "Семинар" }
                ]
            },
            "Б": {
                1: [
                    { num: 1, title: "История России", teacher: "доц. Хутько Т.В.", room: "402", type: "Семинар" },
                    { num: 2, title: "Основы российской государственности", teacher: "доц. Андрейченко О.И.", room: "402", type: "Семинар" },
                    { num: 3, title: "Правоохранительные органы", teacher: "доц. Стрельникова И.Ю.", room: "309", type: "Лекция" }
                ],
                2: [
                    { num: 1, title: "История России", teacher: "доц. Хутько Т.В.", room: "320", type: "Лекция" },
                    { num: 2, title: "Теория государства и права", teacher: "ст.пр. Штурцев Ю.Ю.", room: "402", type: "Семинар" },
                    { num: 3, title: "Теория государства и права", teacher: "ст.пр. Штурцев Ю.Ю.", room: "309", type: "Лекция" }
                ],
                3: [
                    { num: 1, title: "Русский язык и культура речи", teacher: "доц. Андрейченко О.И.", room: "315", type: "Лекция" },
                    { num: 2, title: "Логика", teacher: "доц. Парунова Ю.Д.", room: "315", type: "Лекция" },
                    { num: 3, title: "Основы российской государственности", teacher: "проф. Черникова Л.Ф.", room: "315", type: "Лекция" }
                ],
                4: [
                    { num: 1, title: "История России", teacher: "доц. Хутько Т.В.", room: "315", type: "Лекция" },
                    { num: 2, title: "Физическая культура и спорт", teacher: "доц. Гружевский В.А.", room: "129", type: "Семинар" },
                    { num: 3, title: "Конституционное право", teacher: "ст.пр. Емельянцев А.Э.", room: "403", type: "Семинар" },
                    { num: 4, title: "Иностранный язык", teacher: "проф. Погребняк Н.Н., доц. Эмирильясова С.С.", room: "205, 114", type: "Семинар" }
                ],
                5: [
                    { num: 2, title: "Правоохранительные органы", teacher: "доц. Стрельникова И.Ю.", room: "316", type: "Семинар" },
                    { num: 3, title: "Конституционное право", teacher: "проф. Еремина И.С.", room: "309", type: "Лекция" },
                    { num: 4, title: "Безопасность жизнедеятельности", teacher: "доц. Кислый С.А.", room: "309", type: "Лекция" }
                ]
            }
        };

        let tasks = JSON.parse(localStorage.getItem('student_planner_tasks')) || [];
        let currentDate = new Date();
        let selectedDateStr = formatDateISO(new Date());
        let currentStudyTab = 'schedule';

        function getPairsLabel(count) {
            if (count === 0) return "0 пар";
            if (count === 1) return "1 пара";
            if (count >= 2 && count <= 4) return count + " пары";
            return count + " пар";
        }

        function formatDateISO(d) {
            let month = '' + (d.getMonth() + 1), day = '' + d.getDate(), year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        }

        function parseLocalDate(dateStr) {
            const parts = dateStr.split('-');
            return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        }

        function saveTasks() { localStorage.setItem('student_planner_tasks', JSON.stringify(tasks)); }

        function getWeekTypeForDate(targetDate) {
            const refA = new Date(2026, 8, 14); 
            const tempDate = new Date(targetDate);
            const day = tempDate.getDay();
            const diffToMon = (day === 0 ? -6 : 1 - day);
            const monday = new Date(tempDate);
            monday.setDate(tempDate.getDate() + diffToMon);
            monday.setHours(0,0,0,0);
            const diffWeeks = Math.round((monday - refA) / (7 * 24 * 60 * 60 * 1000));
            return (Math.abs(diffWeeks) % 2 === 0) ? 'А' : 'Б';
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
            document.getElementById('calendar-month-title').innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const totalDays = new Date(year, month + 1, 0).getDate();
            const todayStr = formatDateISO(new Date());

            for (let i = 0; i < firstDayIndex; i++) grid.innerHTML += `<div></div>`;

            for (let day = 1; day <= totalDays; day++) {
                const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isSelected = (dStr === selectedDateStr);
                const isToday = (dStr === todayStr);
                const hasTasks = tasks.some(t => t.date === dStr);

                let btnClass = "h-8 w-8 mx-auto rounded-xl flex flex-col items-center justify-center text-xs font-semibold relative transition-all ";
                if (isSelected) btnClass += "bg-indigo-600 text-white shadow-md shadow-indigo-200";
                else if (isToday) btnClass += "border-2 border-indigo-600 text-indigo-600 bg-indigo-50/50";
                else btnClass += "text-gray-700 hover:bg-gray-100";

                grid.innerHTML += `
                    <div onclick="selectCalendarDate('${dStr}')" class="cursor-pointer py-1">
                        <div class="${btnClass}">
                            <span>${day}</span>
                            ${hasTasks ? '<span class="absolute bottom-1 w-1 h-1 bg-amber-400 rounded-full"></span>' : ''}
                        </div>
                    </div>
                `;
            }
            document.getElementById('selected-date-label').innerText = parseLocalDate(selectedDateStr).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
            updateStudyBannerForDate(selectedDateStr);
            renderTasks();
        }

        function updateStudyBannerForDate(dateStr) {
            const bannerText = document.getElementById('study-banner-text');
            const targetDate = parseLocalDate(dateStr);
            const jsDay = targetDate.getDay();

            if (jsDay === 0 || jsDay === 6) {
                bannerText.innerText = "Выходной день (пар нет)"; return;
            }
            const weekType = getWeekTypeForDate(targetDate);
            const dayLessons = scheduleData[weekType][jsDay] || [];
            if (dayLessons.length === 0) {
                bannerText.innerText = "В этот день пар нет";
            } else {
                const lastLesson = dayLessons.reduce((max, curr) => (curr.num > max.num ? curr : max), dayLessons[0]);
                const bell = bells.find(b => b.num === lastLesson.num);
                bannerText.innerText = `До ${bell.end} (последняя — ${lastLesson.num}-я, всего: ${getPairsLabel(dayLessons.length)})`;
            }
        }

        function changeMonth(direction) { currentDate.setMonth(currentDate.getMonth() + direction); renderCalendar(); }
        function selectCalendarDate(dateStr) { selectedDateStr = dateStr; renderCalendar(); }

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            const dayTasks = tasks.filter(t => t.date === selectedDateStr);

            if (dayTasks.length === 0) {
                list.innerHTML = `<p class="text-xs text-gray-400 text-center py-4 italic">На эту дату задач нет</p>`; return;
            }
            dayTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = "bg-white p-3.5 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between";
                li.innerHTML = `
                    <div class="flex items-center gap-3 w-full pr-2">
                        <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTaskDone(${task.id}, this)" class="w-4 h-4 shrink-0 text-indigo-600 rounded border-gray-300 accent-indigo-600 cursor-pointer">
                        <div class="break-words w-full">
                            <p class="text-xs font-semibold text-gray-800 ${task.done ? 'line-through text-gray-400' : ''}">${escapeHtml(task.text)}</p>
                        </div>
                    </div>
                    <button onclick="deleteTask(${task.id})" class="shrink-0 text-gray-300 hover:text-red-500 transition-colors"><i class="fa-solid fa-trash-can text-xs"></i></button>
                `;
                list.appendChild(li);
            });
        }

        function addTask() {
            const taskInput = document.getElementById('task-text');
            if (!taskInput.value.trim()) return;
            tasks.unshift({ id: Date.now(), text: taskInput.value.trim(), date: selectedDateStr, done: false });
            saveTasks(); renderCalendar(); taskInput.value = '';
        }

        function toggleTaskDone(id, checkbox) {
            const task = tasks.find(t => t.id === id);
            if (task) { task.done = checkbox.checked; saveTasks(); renderTasks(); }
        }
        function deleteTask(id) { tasks = tasks.filter(t => t.id !== id); saveTasks(); renderCalendar(); }
        function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

        let currentWeek = 'Б';
        let currentDayOfWeek = 3;

        function initApp() {
            const today = new Date();
            currentWeek = getWeekTypeForDate(today);
            currentDayOfWeek = today.getDay();

            document.getElementById('week-type-name').innerText = `Неделя «${currentWeek}»`;
            document.getElementById('today-date-text').innerText = today.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });

            renderFullWeekSchedule();
            renderBells();
            renderCalendar();
            
            setInterval(updateClockAndLiveStatus, 1000);
            updateClockAndLiveStatus();
        }

        function renderFullWeekSchedule() {
            const container = document.getElementById('week-schedule-container');
            container.innerHTML = '';
            const weekClasses = scheduleData[currentWeek];

            // Находим понедельник текущей недели
            const now = new Date();
            const currentDayNum = now.getDay();
            const diffToMon = (currentDayNum === 0 ? -6 : 1 - currentDayNum);
            const monday = new Date(now);
            monday.setDate(now.getDate() + diffToMon);

            for (let dayNum = 1; dayNum <= 5; dayNum++) {
                const dayLessons = weekClasses[dayNum] || [];
                const isToday = (dayNum === currentDayOfWeek);

                // Вычисляем конкретную дату для текущего дня недели
                const thisDayDate = new Date(monday);
                thisDayDate.setDate(monday.getDate() + (dayNum - 1));
                const dateStr = thisDayDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

                const dayCardClass = isToday 
                    ? "bg-amber-50/40 rounded-2xl shadow-md border-2 border-amber-400 overflow-hidden" 
                    : "bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden";

                const dayHeaderClass = isToday
                    ? "bg-amber-400 text-slate-900 px-4 py-2.5 flex justify-between items-center"
                    : "bg-gray-100/80 text-gray-700 px-4 py-2 flex justify-between items-center border-b border-gray-100";

                let lessonsHtml = '';
                if (dayLessons.length === 0) {
                    lessonsHtml = `<p class="text-xs text-gray-400 text-center py-4 italic">В этот день занятий нет</p>`;
                } else {
                    dayLessons.forEach(item => {
                        const bell = bells.find(b => b.num === item.num);
                        const isLecture = item.type === "Лекция";
                        const badgeColor = isLecture ? 'bg-amber-100 text-amber-800' : 'bg-indigo-50 text-indigo-700';

                        lessonsHtml += `
                            <div id="card-day-${dayNum}-lesson-${item.num}" class="lesson-card p-3.5 border-b border-gray-100 last:border-b-0 transition-all">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <span class="text-[11px] font-bold text-indigo-600">${item.num} Пара (${bell.start} – ${bell.end})</span>
                                            <span class="badge-live hidden px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300 items-center gap-1 live-badge-ring">
                                                <span class="w-1.5 h-1.5 bg-emerald-600 rounded-full animate-ping"></span> Пара идёт
                                            </span>
                                        </div>
                                        <h4 class="font-bold text-gray-800 text-sm mt-1 leading-snug">${item.title}</h4>
                                        <p class="text-[11px] text-gray-500 mt-1"><i class="fa-solid fa-user-tie mr-1"></i> ${item.teacher}</p>
                                    </div>
                                    <div class="flex flex-col items-end gap-1 shrink-0 ml-2">
                                        <span class="text-[10px] font-bold px-2 py-0.5 rounded ${badgeColor}">${item.type}</span>
                                        <span class="bg-gray-100 text-gray-700 text-xs font-bold px-2 py-0.5 rounded-md mt-0.5">Ауд. ${item.room}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }

                container.innerHTML += `
                    <div class="${dayCardClass}">
                        <div class="${dayHeaderClass}">
                            <div class="flex items-center gap-2 flex-wrap">
                                <div class="flex items-baseline gap-1.5">
                                    <h3 class="font-bold text-sm tracking-wide">${dayNames[dayNum]}</h3>
                                    <span class="text-xs font-medium opacity-70">${dateStr}</span>
                                </div>
                                ${isToday ? '<span class="bg-slate-900 text-amber-300 font-extrabold px-2 py-0.5 rounded text-[10px] uppercase tracking-wider">Сегодня</span>' : ''}
                            </div>
                            <span class="text-[11px] opacity-80 font-medium shrink-0 ml-2">${getPairsLabel(dayLessons.length)}</span>
                        </div>
                        <div class="divide-y divide-gray-100">${lessonsHtml}</div>
                    </div>
                `;
            }
        }

        function renderBells() {
            const bellsList = document.getElementById('bells-list');
            bellsList.innerHTML = '';
            bells.forEach(bell => {
                bellsList.innerHTML += `
                    <li id="bell-row-${bell.num}" class="bell-row p-3.5 flex justify-between items-center transition-all">
                        <span class="font-bold text-gray-800">${bell.num} пара</span>
                        <div class="flex items-center gap-2">
                            <span class="badge-live hidden px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300 items-center gap-1 live-badge-ring">
                                <span class="w-1.5 h-1.5 bg-emerald-600 rounded-full animate-ping"></span> Идёт
                            </span>
                            <span class="time-text font-mono text-indigo-600 font-semibold">${bell.start} – ${bell.end}</span>
                        </div>
                    </li>
                `;
            });
        }

        function timeToMinutes(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function updateClockAndLiveStatus() {
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            const todayDay = now.getDay();
            
            document.getElementById('current-time-text').innerText = now.toLocaleTimeString('ru-RU');

            let activePairNum = null;
            bells.forEach(pair => {
                if (currentMins >= timeToMinutes(pair.start) && currentMins <= timeToMinutes(pair.end)) {
                    activePairNum = pair.num;
                }
            });

            for (let i = 1; i <= 7; i++) {
                const bellRow = document.getElementById(`bell-row-${i}`);
                if (bellRow) {
                    const badge = bellRow.querySelector('.badge-live');
                    const timeText = bellRow.querySelector('.time-text');
                    if (i === activePairNum) {
                        bellRow.className = "bell-row p-3.5 flex justify-between items-center bg-emerald-50/80 border-l-4 border-l-emerald-500 font-bold";
                        badge.classList.remove('hidden'); badge.classList.add('flex');
                        timeText.className = "time-text font-mono text-emerald-700 font-bold";
                    } else {
                        bellRow.className = "bell-row p-3.5 flex justify-between items-center transition-all";
                        badge.classList.add('hidden'); badge.classList.remove('flex');
                        timeText.className = "time-text font-mono text-indigo-600 font-semibold";
                    }
                }
            }

            document.querySelectorAll('.lesson-card').forEach(card => {
                const isCurrentDayCard = card.id.startsWith(`card-day-${todayDay}-`);
                const badge = card.querySelector('.badge-live');
                const cardPairNum = parseInt(card.id.split('-lesson-')[1]);

                if (isCurrentDayCard && cardPairNum === activePairNum) {
                    card.classList.add('bg-emerald-50/60');
                    if (badge) { badge.classList.remove('hidden'); badge.classList.add('flex'); }
                } else {
                    card.classList.remove('bg-emerald-50/60');
                    if (badge) { badge.classList.add('hidden'); badge.classList.remove('flex'); }
                }
            });
        }

        function switchStudyTab(tab) {
            currentStudyTab = tab;
            const mainHeader = document.getElementById('main-header');
            const subTabs = document.getElementById('sub-tabs-container');
            const scrollableContent = document.getElementById('scrollable-study-content');
            
            const isIframe = (tab === 'portal' || tab === 'library');

            if (isIframe) {
                mainHeader.classList.add('hidden');
                subTabs.classList.add('pt-[max(0.5rem,env(safe-area-inset-top))]');
                scrollableContent.style.display = 'none';
                document.getElementById('content-portal').style.display = (tab === 'portal') ? 'flex' : 'none';
                document.getElementById('content-library').style.display = (tab === 'library') ? 'flex' : 'none';
            } else {
                mainHeader.classList.remove('hidden');
                subTabs.classList.remove('pt-[max(0.5rem,env(safe-area-inset-top))]');
                scrollableContent.style.display = 'flex';
                document.getElementById('content-schedule').style.display = (tab === 'schedule') ? 'flex' : 'none';
                document.getElementById('content-bells').style.display = (tab === 'bells') ? 'flex' : 'none';
                document.getElementById('content-portal').style.display = 'none';
                document.getElementById('content-library').style.display = 'none';
            }

            ['schedule', 'bells', 'portal', 'library'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "flex-1 py-2 px-1 text-[11px] font-bold rounded-lg bg-indigo-50 text-indigo-600 transition-colors whitespace-nowrap";
                } else {
                    btn.className = "flex-1 py-2 px-1 text-[11px] font-bold rounded-lg text-gray-500 hover:bg-gray-50 transition-colors whitespace-nowrap";
                }
            });
        }

        function switchView(view) {
            const mainHeader = document.getElementById('main-header');
            
            document.getElementById('view-study').style.display = (view === 'study') ? 'flex' : 'none';
            document.getElementById('view-calendar').style.display = (view === 'calendar') ? 'flex' : 'none';
            
            if (view === 'calendar') {
                mainHeader.classList.remove('hidden');
            } else {
                if (currentStudyTab === 'portal' || currentStudyTab === 'library') {
                    mainHeader.classList.add('hidden');
                } else {
                    mainHeader.classList.remove('hidden');
                }
            }
            
            document.getElementById('nav-study').className = (view === 'study') ? "flex flex-col items-center p-2 text-indigo-600 transition-colors w-20" : "flex flex-col items-center p-2 text-gray-400 hover:text-gray-800 transition-colors w-20";
            document.getElementById('nav-calendar').className = (view === 'calendar') ? "flex flex-col items-center p-2 text-indigo-600 transition-colors w-20" : "flex flex-col items-center p-2 text-gray-400 hover:text-gray-800 transition-colors w-20";
            
            document.getElementById('nav-study').firstElementChild.className = (view === 'study') ? "bg-indigo-100 p-2 rounded-xl mb-1" : "p-2 mb-1";
            document.getElementById('nav-calendar').firstElementChild.className = (view === 'calendar') ? "bg-indigo-100 p-2 rounded-xl mb-1" : "p-2 mb-1";
        }

        window.onload = initApp;
    </script>
</body>
</html>
